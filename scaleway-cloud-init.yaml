#cloud-config
# ==============================================================================
# OENEXA (OEN) — Scaleway Cloud-init Setup Script (Cloud-init VERSION 22.1+)
# Target: Scaleway Elastic Metal (Dedicated Servers) & Scaleway Cloud Instances
# Operating System: Ubuntu 22.04 LTS / 24.04 LTS / Debian 12 (x86_64 / arm64)
# ==============================================================================
# HOW TO USE IN SCALEWAY CONSOLE:
# 1. In Scaleway Console, go to Elastic Metal (or Instances) -> Create Server.
# 2. Select Ubuntu 22.04 LTS or 24.04 LTS.
# 3. Under "Advanced Options" -> "Cloud-init configuration *":
#    Copy and paste this ENTIRE file into the text box.
# 4. (Optional) Customize the ENVIRONMENT VARIABLES in /opt/oenexa/.env below.
# 5. Launch the server! The full node + explorer stack will deploy automatically.
# ==============================================================================

package_update: true
package_upgrade: false

# ── 1. System Packages ────────────────────────────────────────────────────────
packages:
  - apt-transport-https
  - ca-certificates
  - curl
  - gnupg
  - lsb-release
  - git
  - ufw
  - fail2ban
  - jq
  - htop
  - tar
  - wget
  - net-tools

# ── 2. Dedicated Operator User ────────────────────────────────────────────────
users:
  - default
  - name: oenexa
    gecos: OENEXA System Operator
    groups: [sudo, docker]
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL

# ── 3. Embedded Configuration Files ───────────────────────────────────────────
write_files:

  # ── A. System Hardening & Performance Sysctl ────────────────────────────────
  - path: /etc/sysctl.d/99-oenexa.conf
    owner: root:root
    permissions: '0644'
    content: |
      # OENEXA High-Throughput Blockchain Network & Memory Tuning
      fs.file-max = 2097152
      net.core.somaxconn = 65535
      net.core.netdev_max_backlog = 10000
      net.ipv4.tcp_max_syn_backlog = 8192
      net.ipv4.tcp_rmem = 4096 87380 16777216
      net.ipv4.tcp_wmem = 4096 65536 16777216
      vm.max_map_count = 262144
      vm.swappiness = 10

  # ── B. Security Limits (Disable Core Dumps for PQC Key Protection) ───────────
  - path: /etc/security/limits.d/99-oenexa.conf
    owner: root:root
    permissions: '0644'
    content: |
      # Prevent memory extraction of NIST PQC (ML-DSA-65 / ML-KEM-768) private keys
      * hard core 0
      * soft core 0
      # Max open files for high-peer P2P gossip
      * soft nofile 65536
      * hard nofile 65536
      root soft nofile 65536
      root hard nofile 65536

  # ── C. Stack Environment Variables ──────────────────────────────────────────
  - path: /opt/oenexa/.env
    owner: root:root
    permissions: '0600'
    content: |
      # ────────────────────────────────────────────────────────────────────────
      # OENEXA CLOUD ENVIRONMENT CONFIGURATION
      # ────────────────────────────────────────────────────────────────────────
      # Keystore encryption password (leave blank to auto-generate a secure 32-char key)
      OEN_PASSWORD=

      # Network Mode: standalone-miner (produces blocks immediately) | testnet | mainnet
      NETWORK_MODE=standalone-miner

      # Node Log Level: debug | info | warn | error
      LOG_LEVEL=info

      # Ports
      P2P_PORT=8765
      RPC_PORT=8545
      METRICS_PORT=9090
      EXPLORER_PORT=80

      # Optional Custom Domain (e.g. node.example.com) for Automatic HTTPS via Caddy
      DOMAIN_NAME=

      # Optional GitHub Token for cloning private repositories
      GITHUB_TOKEN=

      # Monitoring (Grafana password if monitoring profile is enabled)
      GRAFANA_PASSWORD=admin

  # ── D. Layer-1 Node TOML Configuration (Production) ─────────────────────────
  - path: /opt/oenexa/configs/node.toml
    owner: root:root
    permissions: '0644'
    content: |
      [chain]
      network_id = 1
      name       = "OENEXA Production Node"

      [node]
      data_dir      = "/data"
      keystore_file = "keystore.json"
      miner_enabled = true
      log_level     = "info"

      [p2p]
      listen_addr     = "0.0.0.0:8765"
      external_addr   = ""
      max_peers       = 50
      bootstrap_peers = [
        "oenexa-seed1.oenexa.io:8765",
        "oenexa-seed2.oenexa.io:8765"
      ]

      [rpc]
      enabled       = true
      listen_addr   = "0.0.0.0:8545"
      cors_origins  = ["*"]
      read_timeout  = "30s"
      write_timeout = "30s"

      [storage]
      blocks_dir = "blocks"
      state_dir  = "state"

      [metrics]
      enabled     = true
      listen_addr = "0.0.0.0:9090"

      [upgrade]
      release_url    = "https://api.github.com/repos/oenexa/oenexa-node/releases/latest"
      check_interval = "1h"
      auto_apply     = false

  # ── E. Docker Compose Stack Manifest ────────────────────────────────────────
  - path: /opt/oenexa/docker-compose.yml
    owner: root:root
    permissions: '0644'
    content: |
      services:
        # ── 1. OENEXA Quantum-Safe L1 Blockchain Node ─────────────────────────
        oenexa-node:
          build:
            context: ./src/oenexa-node
            dockerfile: Dockerfile
          image: oenexa-node:latest
          container_name: oenexa-node
          restart: unless-stopped
          environment:
            OEN_PASSWORD: "${OEN_PASSWORD}"
          ports:
            # P2P mesh port - MUST be publicly open
            - "${P2P_PORT:-8765}:8765/tcp"
            # JSON-RPC port - bound locally; proxied publicly through Explorer/Caddy
            - "127.0.0.1:${RPC_PORT:-8545}:8545/tcp"
            # Prometheus metrics - bound locally
            - "127.0.0.1:${METRICS_PORT:-9090}:9090/tcp"
          volumes:
            - oen-chain-data:/data
            - ./configs/node.toml:/data/config.toml:ro
          command: >
            start
            --config /data/config.toml
            --datadir /data
            --miner
            --metrics
          healthcheck:
            test: ["CMD", "/healthcheck"]
            interval: 15s
            timeout: 5s
            retries: 3
            start_period: 10s
          networks:
            - oenexa-net

        # ── 2. OENEXA Explorer Dashboard + Web3 JSON-RPC Reverse Proxy ────────
        oenexa-explorer:
          build:
            context: ./src/oenexa-explorer
            dockerfile: Dockerfile
          image: oenexa-explorer:latest
          container_name: oenexa-explorer
          restart: unless-stopped
          ports:
            # Web UI + JSON-RPC reverse proxy on Port 80
            - "${EXPLORER_PORT:-80}:80/tcp"
          depends_on:
            oenexa-node:
              condition: service_healthy
          networks:
            - oenexa-net

      volumes:
        oen-chain-data:
          name: oen-chain-data

      networks:
        oenexa-net:
          name: oenexa-net
          driver: bridge

  # ── F. Systemd Unit for the OENEXA Stack ────────────────────────────────────
  - path: /etc/systemd/system/oenexa.service
    owner: root:root
    permissions: '0644'
    content: |
      [Unit]
      Description=OENEXA (OEN) Quantum-Shielded Layer-1 Blockchain Stack
      Documentation=https://github.com/oenexa/oenexa-node
      After=docker.service network-online.target
      Requires=docker.service
      Wants=network-online.target

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      WorkingDirectory=/opt/oenexa
      EnvironmentFile=/opt/oenexa/.env
      ExecStart=/usr/bin/docker compose -f /opt/oenexa/docker-compose.yml up -d
      ExecStop=/usr/bin/docker compose -f /opt/oenexa/docker-compose.yml down
      TimeoutStartSec=600

      [Install]
      WantedBy=multi-user.target

  # ── G. Management CLI Tool (`oenexa-ctl`) ───────────────────────────────────
  - path: /usr/local/bin/oenexa-ctl
    owner: root:root
    permissions: '0755'
    content: |
      #!/usr/bin/env bash
      # OENEXA Node Cluster Management Utility
      set -e
      ROOT_DIR="/opt/oenexa"
      ENV_FILE="$ROOT_DIR/.env"

      CYAN='\033[0;36m'
      GREEN='\033[0;32m'
      YELLOW='\033[1;33m'
      RED='\033[0;31m'
      NC='\033[0m'

      if [ -f "$ENV_FILE" ]; then
        export $(grep -v '^#' "$ENV_FILE" | xargs -d '\n')
      fi

      case "$1" in
        status)
          echo -e "${CYAN}=== OENEXA Stack Status ===${NC}"
          docker compose -f "$ROOT_DIR/docker-compose.yml" ps
          echo ""
          echo -e "${CYAN}=== Node Telemetry (/api/status) ===${NC}"
          curl -s --connect-timeout 2 http://127.0.0.1:8545/api/status | jq . 2>/dev/null || curl -s http://127.0.0.1:8545/api/status || echo -e "${RED}Node RPC unreachable${NC}"
          echo ""
          echo -e "${CYAN}=== Recent Chain Info (oen_chainInfo) ===${NC}"
          curl -s -X POST http://127.0.0.1:8545/ -H "Content-Type: application/json" -d '{"jsonrpc":"2.0","id":1,"method":"oen_chainInfo","params":null}' | jq . 2>/dev/null || true
          ;;
        logs)
          SERVICE="${2:-}"
          docker compose -f "$ROOT_DIR/docker-compose.yml" logs -f $SERVICE
          ;;
        restart)
          echo -e "${YELLOW}Restarting OENEXA Stack...${NC}"
          docker compose -f "$ROOT_DIR/docker-compose.yml" restart
          echo -e "${GREEN}✓ Restart complete.${NC}"
          ;;
        stop)
          echo -e "${YELLOW}Stopping OENEXA Stack...${NC}"
          docker compose -f "$ROOT_DIR/docker-compose.yml" stop
          echo -e "${GREEN}✓ Stopped.${NC}"
          ;;
        start)
          echo -e "${YELLOW}Starting OENEXA Stack...${NC}"
          docker compose -f "$ROOT_DIR/docker-compose.yml" up -d
          echo -e "${GREEN}✓ Started.${NC}"
          ;;
        backup-keystore)
          BACKUP_DIR="/opt/oenexa/backups"
          mkdir -p "$BACKUP_DIR"
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          TARGET="$BACKUP_DIR/keystore_backup_$TIMESTAMP.json"
          docker cp oenexa-node:/data/keystore.json "$TARGET" 2>/dev/null || cp /var/lib/docker/volumes/oen-chain-data/_data/keystore.json "$TARGET" 2>/dev/null || true
          if [ -f "$TARGET" ]; then
            chmod 600 "$TARGET"
            echo -e "${GREEN}✓ Keystore backed up to: $TARGET${NC}"
            echo -e "${YELLOW}⚠️ Store this file securely off-server immediately!${NC}"
          else
            echo -e "${RED}Failed to locate keystore.json. Is the node running?${NC}"
          fi
          ;;
        rpc)
          METHOD="${2:-oen_chainInfo}"
          PARAMS="${3:-null}"
          curl -s -X POST http://127.0.0.1:8545/ \
            -H "Content-Type: application/json" \
            -d "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"$METHOD\",\"params\":$PARAMS}" | jq .
          ;;
        height)
          curl -s -X POST http://127.0.0.1:8545/ \
            -H "Content-Type: application/json" \
            -d '{"jsonrpc":"2.0","id":1,"method":"oen_blockHeight","params":null}' | jq -r .result
          ;;
        *)
          echo "Usage: oenexa-ctl {status|logs [service]|restart|start|stop|backup-keystore|rpc <method> <params>|height}"
          exit 1
          ;;
      esac

# ── 4. Cloud-init Boot Orchestration Commands ─────────────────────────────────
runcmd:
  - echo "======================================================================" >> /var/log/oenexa-deploy.log
  - echo "Starting OENEXA Automated Scaleway Provisioning: $(date)" >> /var/log/oenexa-deploy.log
  - echo "======================================================================" >> /var/log/oenexa-deploy.log

  # Step A: Apply Kernel & Limit Parameters
  - sysctl --system >> /var/log/oenexa-deploy.log 2>&1

  # Step B: Install Official Docker CE & Plugins
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null
  - apt-get update -y >> /var/log/oenexa-deploy.log 2>&1
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin >> /var/log/oenexa-deploy.log 2>&1
  - systemctl enable docker
  - systemctl start docker

  # Step C: Setup Directory Layout
  - mkdir -p /opt/oenexa/src
  - mkdir -p /opt/oenexa/configs
  - mkdir -p /opt/oenexa/backups
  - chown -R oenexa:oenexa /opt/oenexa

  # Step D: Configure UFW Security Firewall
  - ufw default deny incoming >> /var/log/oenexa-deploy.log 2>&1
  - ufw default allow outgoing >> /var/log/oenexa-deploy.log 2>&1
  - ufw allow 22/tcp comment "SSH Remote Administration" >> /var/log/oenexa-deploy.log 2>&1
  - ufw allow 8765/tcp comment "OENEXA P2P Consensus Network" >> /var/log/oenexa-deploy.log 2>&1
  - ufw allow 80/tcp comment "HTTP Web Explorer & JSON-RPC Gateway" >> /var/log/oenexa-deploy.log 2>&1
  - ufw allow 443/tcp comment "HTTPS Web Explorer & JSON-RPC Gateway" >> /var/log/oenexa-deploy.log 2>&1
  - ufw --force enable >> /var/log/oenexa-deploy.log 2>&1

  # Step E: Configure Fail2Ban
  - systemctl enable fail2ban >> /var/log/oenexa-deploy.log 2>&1
  - systemctl restart fail2ban >> /var/log/oenexa-deploy.log 2>&1

  # Step F: Generate Secure Keystore Password if None Provided
  - |
    ENV_FILE="/opt/oenexa/.env"
    EXISTING_PASS=$(grep '^OEN_PASSWORD=' "$ENV_FILE" | cut -d '=' -f2-)
    if [ -z "$EXISTING_PASS" ]; then
      AUTO_PASS=$(openssl rand -hex 24)
      sed -i "s/^OEN_PASSWORD=.*/OEN_PASSWORD=${AUTO_PASS}/" "$ENV_FILE"
      echo "[Security] Generated 48-char random OEN_PASSWORD and saved to $ENV_FILE" >> /var/log/oenexa-deploy.log
    fi

  # Step G: Clone or Prepare Source Repositories
  - |
    cd /opt/oenexa/src
    ENV_FILE="/opt/oenexa/.env"
    GH_TOKEN=$(grep '^GITHUB_TOKEN=' "$ENV_FILE" | cut -d '=' -f2-)

    # Clone oenexa-node
    if [ ! -d "/opt/oenexa/src/oenexa-node" ]; then
      if [ -n "$GH_TOKEN" ]; then
        git clone "https://${GH_TOKEN}@github.com/oenexa/oenexa-node.git" /opt/oenexa/src/oenexa-node >> /var/log/oenexa-deploy.log 2>&1 || true
      else
        git clone "https://github.com/oenexa/oenexa-node.git" /opt/oenexa/src/oenexa-node >> /var/log/oenexa-deploy.log 2>&1 || true
      fi
    fi

    # Clone oenexa-explorer
    if [ ! -d "/opt/oenexa/src/oenexa-explorer" ]; then
      if [ -n "$GH_TOKEN" ]; then
        git clone "https://${GH_TOKEN}@github.com/oenexa/oenexa-explorer.git" /opt/oenexa/src/oenexa-explorer >> /var/log/oenexa-deploy.log 2>&1 || true
      else
        git clone "https://github.com/oenexa/oenexa-explorer.git" /opt/oenexa/src/oenexa-explorer >> /var/log/oenexa-deploy.log 2>&1 || true
      fi
    fi
    chown -R oenexa:oenexa /opt/oenexa/src

  # Step H: Launch the Systemd Stack Service
  - systemctl daemon-reload
  - systemctl enable oenexa.service >> /var/log/oenexa-deploy.log 2>&1
  - systemctl start oenexa.service >> /var/log/oenexa-deploy.log 2>&1

  # Step I: Health Check & Verification
  - |
    echo "Waiting for OENEXA Node initialization and RPC readiness..." >> /var/log/oenexa-deploy.log
    MAX_ATTEMPTS=40
    COUNT=0
    SUCCESS=false
    while [ $COUNT -lt $MAX_ATTEMPTS ]; do
      if curl -s http://127.0.0.1:8545/api/status 2>/dev/null | grep -q '"online":true'; then
        SUCCESS=true
        break
      fi
      sleep 3
      COUNT=$((COUNT+1))
    done

    PUBLIC_IP=$(curl -s https://api.ipify.org || hostname -I | awk '{print $1}')

    if [ "$SUCCESS" = true ]; then
      echo "✓ OENEXA Node is live and producing blocks at: http://${PUBLIC_IP}" >> /var/log/oenexa-deploy.log
    else
      echo "⚠️ Node is initializing (check 'oenexa-ctl logs oenexa-node' or /var/log/oenexa-deploy.log)" >> /var/log/oenexa-deploy.log
    fi

    # Generate Motd Login Banner
    cat << EOF > /etc/motd
    ========================================================================
     🏛️ OENEXA (OEN) Quantum-Shielded Layer-1 Blockchain Server
     Platform: Scaleway Cloud / Elastic Metal Dedicated Server
    ========================================================================
     • Public Web Explorer : http://${PUBLIC_IP}
     • Web3 JSON-RPC URL   : http://${PUBLIC_IP}/rpc  (Internal: 127.0.0.1:8545)
     • P2P Consensus Port  : 8765/tcp (Publicly active)
     • Stack Directory     : /opt/oenexa
     • CLI Control Tool    : oenexa-ctl {status|logs|restart|rpc|backup-keystore}
    ========================================================================
    EOF

# ── 5. Completion Status Message ──────────────────────────────────────────────
final_message: "OENEXA Scaleway Cloud-init deployment successfully executed after $UPTIME seconds."
