# OENEXA Docker Devnet Configuration
# ────────────────────────────────────────────────────────────────────────────
# Used by Docker and oenexa-run.sh for containerized development.
# Blocks are produced locally by the embedded validator engine every 2 seconds.

[chain]
network_id = 1337
name       = "OENEXA Docker Devnet"

[node]
data_dir      = "/data"
keystore_file = "keystore.json"
miner_enabled = true
log_level     = "info"

[p2p]
listen_addr     = "0.0.0.0:8765"
external_addr   = ""
max_peers       = 10
bootstrap_peers = []

[rpc]
enabled       = true
listen_addr   = "0.0.0.0:8545"
cors_origins  = ["*"]
read_timeout  = "30s"
write_timeout = "30s"

[storage]
blocks_dir = "blocks"
state_dir  = "state"

[metrics]
enabled     = true
listen_addr = "0.0.0.0:9090"

[upgrade]
release_url    = ""
check_interval = "24h"
auto_apply     = false
