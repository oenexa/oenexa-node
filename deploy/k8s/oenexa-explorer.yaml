apiVersion: apps/v1
kind: Deployment
metadata:
  name: oenexa-explorer
  namespace: oenexa-network
  labels:
    app: oenexa-explorer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oenexa-explorer
  template:
    metadata:
      labels:
        app: oenexa-explorer
    spec:
      containers:
        - name: explorer
          image: oenexa-explorer:latest
          imagePullPolicy: IfNotPresent # For local use
          ports:
            - containerPort: 80
              name: http
---
apiVersion: v1
kind: Service
metadata:
  name: oenexa-explorer-svc
  namespace: oenexa-network
spec:
  type: LoadBalancer # Exposes the explorer outside the cluster
  selector:
    app: oenexa-explorer
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 80
