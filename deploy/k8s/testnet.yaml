apiVersion: v1
kind: Namespace
metadata:
  name: oenexa-testnet
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: oenexa-config
  namespace: oenexa-testnet
data:
  config.toml: |
    [chain]
    network_id = 2
    name = "Oenexa Kubernetes Testnet"
    validators = [
      "4ea5612584d9ddf73994531ee13c4daedca062c9ca50e18ff75ed3d4ebb72803",
      "bfbd0eae0130a0a38c6cf9145146348227fdf9a3d084f71e51dfa5e50a79eeee",
      "b9981f876ff89ac2620b49d19c4928a3f252ebce88741de55815ded0f66b3a55",
      "eab918c3f73ad9f4c815d0ebb27ede7913c262247466416132339fb4c8c818a1",
    ]
    
    [node]
    data_dir = "/data"
    keystore_file = "keystore.json"
    miner_enabled = true
    log_level = "info"
    
    [p2p]
    listen_addr = "0.0.0.0:8765"
    bootstrap_peers = [
      "/dns4/oenexa-node-0.oenexa-p2p.oenexa-testnet.svc.cluster.local/tcp/8765/p2p/12D3KooWCCJX4qVLL3sUWXpZyG4vXQqX3CyUwjJDUNGvMviiYgRb",
      "/dns4/oenexa-node-1.oenexa-p2p.oenexa-testnet.svc.cluster.local/tcp/8765/p2p/12D3KooWCHAMnJnqxc9tH3snMXyR7EdKAFfBo93xsnrmCc9txrmt",
      "/dns4/oenexa-node-2.oenexa-p2p.oenexa-testnet.svc.cluster.local/tcp/8765/p2p/12D3KooWLnSWguxACmXNzW9abSoogPX7ZkMYR6McpaxZ8k4rYYUm",
      "/dns4/oenexa-node-3.oenexa-p2p.oenexa-testnet.svc.cluster.local/tcp/8765/p2p/12D3KooWNuNMSPVz2WRzvUVeayd4xe3ijm13QGupD6omBq1xHQyi",
    ]
    max_peers = 50
    
    [rpc]
    enabled = true
    listen_addr = "0.0.0.0:8545"
    cors_allowed_origins = ["*"]
    
    [storage]
    backend = "leveldb"
    cache_size_mb = 256
    
    [metrics]
    enabled = true
    listen_addr = "0.0.0.0:9090"
---
apiVersion: v1
kind: Secret
metadata:
  name: oenexa-secrets
  namespace: oenexa-testnet
type: Opaque
stringData:
  OEN_PASSWORD: "testnet-password"
---
apiVersion: v1
kind: Service
metadata:
  name: oenexa-p2p
  namespace: oenexa-testnet
spec:
  clusterIP: None
  selector:
    app: oenexa-node
  ports:
    - name: p2p
      protocol: TCP
      port: 8765
---
apiVersion: v1
kind: Service
metadata:
  name: oenexa-rpc
  namespace: oenexa-testnet
spec:
  type: ClusterIP
  selector:
    app: oenexa-node
  ports:
    - name: rpc
      protocol: TCP
      port: 8545
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: oenexa-node
  namespace: oenexa-testnet
spec:
  serviceName: "oenexa-p2p"
  replicas: 4
  selector:
    matchLabels:
      app: oenexa-node
  template:
    metadata:
      labels:
        app: oenexa-node
    spec:
      containers:
        - name: node
          image: oenexa-node:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OEN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: oenexa-secrets
                  key: OEN_PASSWORD
          command:
            - "/oenexa-node"
            - "start"
            - "--config"
            - "/config/config.toml"
            - "--keystore"
            - "/keys/$(POD_NAME)/keystore.json"
          ports:
            - containerPort: 8765
              name: p2p
            - containerPort: 8545
              name: rpc
            - containerPort: 9090
              name: metrics
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /config
            - name: key-0
              mountPath: /keys/oenexa-node-0
            - name: key-1
              mountPath: /keys/oenexa-node-1
            - name: key-2
              mountPath: /keys/oenexa-node-2
            - name: key-3
              mountPath: /keys/oenexa-node-3
      volumes:
        - name: config
          configMap:
            name: oenexa-config
        - name: key-0
          secret:
            secretName: oenexa-keystore-0
        - name: key-1
          secret:
            secretName: oenexa-keystore-1
        - name: key-2
          secret:
            secretName: oenexa-keystore-2
        - name: key-3
          secret:
            secretName: oenexa-keystore-3
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 10Gi
