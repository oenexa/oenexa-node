name: OENEXA Node CI/CD

on:
  workflow_dispatch:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  quality-and-tests:
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.24'
          cache-dependency-path: go.sum

      - name: Go Vet
        run: go vet ./...

      - name: Run Go Tests
        run: go test -v ./...

  build-and-push:
    needs: quality-and-tests
    runs-on: [self-hosted, linux]
    permissions:
      contents: read
      packages: write
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push OENEXA Node Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: [self-hosted, linux]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy OENEXA Node directly on VPS
        run: |
          set -e
          echo "Deploying OENEXA Node on VPS (62.210.92.60)..."
          if [ -d "/opt/oenexa/src/oenexa-node" ]; then
            cd /opt/oenexa/src/oenexa-node
            git fetch origin main
            git reset --hard origin/main
          fi
          cd /opt/oenexa
          docker compose -f docker-compose.prod.yml build oenexa-node
          docker compose -f docker-compose.prod.yml up -d --no-deps oenexa-node
          docker compose -f docker-compose.prod.yml ps oenexa-node
