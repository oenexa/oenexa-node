services:

  # ── 1. PostgreSQL 17 + pgvector (AI Vector Embeddings & Relational Store) ───
  oenexa-postgres:
    image: pgvector/pgvector:pg17
    container_name: oenexa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-oenexa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oenexa_prod_secret}
      POSTGRES_DB: ${POSTGRES_DB:-oenexa_db}
    volumes:
      - oenexa-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-oenexa} -d ${POSTGRES_DB:-oenexa_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - oenexa-net

  # ── 2. Redis 7 (Distributed Caching & Semaphore Locks) ──────────────────────
  oenexa-redis:
    image: redis:7-alpine
    container_name: oenexa-redis
    restart: unless-stopped
    volumes:
      - oenexa-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - oenexa-net

  # ── 3. OENEXA AI Core (Java 25 Virtual Threads Multi-Agent Swarm) ───────────
  oenexa-ai-core:
    build:
      context: ./src/oenexa-ai-core
      dockerfile: Dockerfile
    image: oenexa-ai-core:latest
    container_name: oenexa-ai-core
    restart: unless-stopped
    depends_on:
      oenexa-postgres:
        condition: service_healthy
      oenexa-redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://oenexa-postgres:5432/${POSTGRES_DB:-oenexa_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-oenexa}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-oenexa_prod_secret}
      SPRING_REDIS_HOST: oenexa-redis
      SPRING_REDIS_PORT: 6379
      OENEXA_REDIS_ENABLED: "true"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      OLLAMA_HOST: "${OLLAMA_HOST:-http://host.docker.internal:11434}"
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    networks:
      - oenexa-net

  # ── 4. OENEXA AI Web Cockpit (React 18 + Vite on /ai) ───────────────────────
  oenexa-ai-web:
    build:
      context: ./src/oenexa-ai-web
      dockerfile: Dockerfile
    image: oenexa-ai-web:latest
    container_name: oenexa-ai-web
    restart: unless-stopped
    depends_on:
      oenexa-ai-core:
        condition: service_healthy
    expose:
      - "80"
    networks:
      - oenexa-net

  # ── 5. OENEXA Quantum-Safe Layer-1 Blockchain Node ──────────────────────────
  oenexa-node:
    build:
      context: ./src/oenexa-node
      dockerfile: Dockerfile
    image: oenexa-node:latest
    container_name: oenexa-node
    restart: unless-stopped
    environment:
      OEN_PASSWORD: "${OEN_PASSWORD}"
    ports:
      - "${P2P_PORT:-8765}:8765"
      - "127.0.0.1:${RPC_PORT:-8545}:8545"
      - "127.0.0.1:${METRICS_PORT:-9090}:9090"
    volumes:
      - oen-chain-data:/data
      - ./configs/node.toml:/data/config.toml:ro
    command: >
      start
      --config /data/config.toml
      --datadir /data
      --miner
      --metrics
    healthcheck:
      test: ["CMD", "/healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - oenexa-net

  # ── 6. OENEXA Decoupled Blockchain Explorer (React 18 + Vite on /) ──────────
  oenexa-explorer:
    build:
      context: ./src/oenexa-explorer
      dockerfile: Dockerfile
    image: oenexa-explorer:latest
    container_name: oenexa-explorer
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      oenexa-node:
        condition: service_healthy
    networks:
      - oenexa-net

  # ── 7. Caddy Universal SSL/TLS Reverse Proxy Gateway ────────────────────────
  caddy:
    image: caddy:2-alpine
    container_name: oenexa-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - oenexa-explorer
      - oenexa-ai-web
    networks:
      - oenexa-net

volumes:
  oen-chain-data:
    name: oen-chain-data
  oenexa-postgres-data:
    name: oenexa-postgres-data
  oenexa-redis-data:
    name: oenexa-redis-data
  caddy-data:
    name: caddy-data
  caddy-config:
    name: caddy-config

networks:
  oenexa-net:
    name: oenexa-net
    driver: bridge
