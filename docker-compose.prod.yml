# docker-compose.prod.yml — OENEXA (ONXC) Production Layer-1 Stack
# Pure Blockchain Core deployment: oenexa-node + Caddy TLS RPC Gateway + Monitoring

services:

  # ── 1. OENEXA Quantum-Safe Layer-1 Blockchain Node ──────────────────────────
  oenexa-node:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/oenexa/oenexa-node:v1.0.0
    container_name: oenexa-node
    restart: unless-stopped
    environment:
      ONXC_PASSWORD: "${ONXC_PASSWORD:?ONXC_PASSWORD must be set in .env}"
    ports:
      - "${P2P_PORT:-8765}:8765/tcp"
      - "127.0.0.1:${RPC_PORT:-8545}:8545/tcp"
      - "127.0.0.1:${METRICS_PORT:-9090}:9090/tcp"
    volumes:
      - onxc-chain-data:/data
      - ./configs/mainnet.toml:/data/config.toml:ro
    command: >
      start
      --config /data/config.toml
      --datadir /data
      --metrics
    healthcheck:
      test: ["CMD", "/healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - oenexa-net

  # ── 2. Caddy Universal SSL/TLS RPC Reverse Proxy Gateway ────────────────────
  caddy:
    image: caddy:2-alpine
    container_name: oenexa-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      oenexa-node:
        condition: service_healthy
    networks:
      - oenexa-net

  # ── 3. Prometheus (optional — enable with --profile monitoring) ─────────────
  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v2.53.0
    container_name: onxc-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9091:9090"
    volumes:
      - ./configs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    networks:
      - oenexa-net

  # ── 4. Grafana (optional — enable with --profile monitoring) ────────────────
  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:11.2.0
    container_name: onxc-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_PASSWORD:?GRAFANA_PASSWORD must be set in .env}"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - oenexa-net

volumes:
  onxc-chain-data:
    name: onxc-chain-data
  caddy-data:
    name: caddy-data
  caddy-config:
    name: caddy-config
  prometheus-data:
    name: prometheus-data
  grafana-data:
    name: grafana-data

networks:
  oenexa-net:
    name: oenexa-net
    driver: bridge
