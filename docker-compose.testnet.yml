    ports:
      - "8546:8545"
    volumes:
      - node1-data:/data
      - ./deploy/k8s/testnet-config.toml:/data/config.toml:ro
      - ./deploy/k8s/testnet-keys/oenexa-node-1/keystore.json:/data/keystore.json:ro
    command: >
      start --config /data/config.toml --keystore /data/keystore.json

  node2:
