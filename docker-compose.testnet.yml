    image: oenexa-node:testnet
    container_name: oenexa-node2
    restart: unless-stopped
    environment:
      OEN_PASSWORD: "testnet-password"
    ports:
      - "8547:8545"
    volumes:
      - node2-data:/data
      - ./deploy/k8s/testnet-config.toml:/data/config.toml:ro
      - ./deploy/k8s/testnet-keys/node2/keystore.json:/data/keystore.json:ro
    command: >
      start --config /data/config.toml --keystore /data/keystore.json

  node3:
    build:
      context: .
      dockerfile: Dockerfile
    image: oenexa-node:testnet
    container_name: oenexa-node3
    restart: unless-stopped
    environment:
      OEN_PASSWORD: "testnet-password"
    ports:
      - "8548:8545"
