services:
  node0:
    build:
      context: .
      dockerfile: Dockerfile
    image: oenexa-node:testnet
    container_name: oenexa-node0
    restart: unless-stopped
    environment:
      OEN_PASSWORD: "testnet-password"
    ports:
      - "8545:8545" # RPC for node0
    volumes:
      - node0-data:/data
      - ./deploy/k8s/testnet-config.toml:/data/config.toml:ro
      - ./deploy/k8s/testnet-keys/oenexa-node-0/keystore.json:/data/keystore.json:ro
    command: >
      start --config /data/config.toml --keystore /data/keystore.json

  node1:
    build:
      context: .
      dockerfile: Dockerfile
    image: oenexa-node:testnet
    container_name: oenexa-node1
    restart: unless-stopped
