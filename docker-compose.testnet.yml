      - node3-data:/data
      - ./deploy/k8s/testnet-config.toml:/data/config.toml:ro
      - ./deploy/k8s/testnet-keys/node3/keystore.json:/data/keystore.json:ro
    command: >
      start --config /data/config.toml --keystore /data/keystore.json

volumes:
  node0-data:
  node1-data:
  node2-data:
  node3-data:
